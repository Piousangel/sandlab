# main에 머지되면 검사 후 Cloudflare Workers로 배포한다(버셀 금지 — Cloudflare 전용).
# 06시 클라우드 개발팀 루틴은 로컬 wrangler 로그인이 없으므로 배포는 여기서 한다.
# 필요한 저장소 시크릿: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit, Zone Workers Routes:Edit 권한), CLOUDFLARE_ACCOUNT_ID
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # verify.test.ts는 5초 타임아웃으로 6개가 늘 실패(기존 문제, 백로그)
      # spill:verify는 CI에서 22분 걸려(로컬 ~3분) 여기서 빼고, 머지 전(06시 루틴·로컬)에 돌린다
      - run: pnpm test --exclude src/lib/spill/verify/verify.test.ts
      # deploy = next build → verify-ads → wrangler deploy
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

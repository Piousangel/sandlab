# 매일 새벽(04:07·05:17 KST) — 아침 회의(06:00 클라우드 루틴) 자료로 지표를 뽑아 docs/daily/metrics/<KST날짜>.md 로 커밋한다.
# 필요 시크릿: CLOUDFLARE_API_TOKEN(D1 Edit(쿼리 API가 Edit 요구) · Account Analytics Read · Zone Read · Zone Analytics Read 포함), CLOUDFLARE_ACCOUNT_ID
name: metrics
on:
  # GitHub 예약 실행은 지연·누락이 잦다(11-13 05:30 실행이 아예 안 뜸). 두 번 걸어 하나는 06시 전에 끝나게 한다.
  schedule:
    - cron: '7 19 * * *'   # 04:07 KST
    - cron: '17 20 * * *'  # 05:17 KST (같은 날 파일을 최신으로 덮어씀)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metrics
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 지표 수집
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          d=$(TZ=Asia/Seoul date +%F)
          mkdir -p docs/daily/metrics
          node scripts/daily-metrics.mjs > "docs/daily/metrics/$d.md"
          cat "docs/daily/metrics/$d.md"
      - name: 커밋
        run: |
          git config user.name "sandlab-metrics[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily/metrics
          git diff --cached --quiet || git commit -m "chore(metrics): $(TZ=Asia/Seoul date +%F) 지표"
          git push

# main에 머지되면 검사 후 Cloudflare Workers로 배포한다(버셀 금지 — Cloudflare 전용).
# 06시 클라우드 개발팀 루틴은 로컬 wrangler 로그인이 없으므로 배포는 여기서 한다.
# 필요한 저장소 시크릿: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit, Zone Workers Routes:Edit 권한), CLOUDFLARE_ACCOUNT_ID
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    # 수동 실행(workflow_dispatch)도 main에서만 — 리뷰 안 된 브랜치가 프로덕션에 가지 않게(저장소 안전 설정 E, 11-20).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # 만성 실패 0(11-20): verify.test 포함 전체. 무거운 시뮬은 vitest.config.ts sim 프로젝트(5분 한도).
      # spill:verify는 PR 단계 CI(ci.yml)가 두 job으로 나눠 머지 전에 돈다(각 ≤ 9분) — 배포에서는 다시 돌리지 않는다.
      - run: pnpm test
      # deploy = next build → verify-ads → wrangler deploy
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
